<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 홈 화면에서 전체 화면으로 뜰 때 노치 밑까지 그린다.
         안전 영역은 styles.css 의 .app 이 env(safe-area-inset-*) 로 비워 둔다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>아랍어 읽기</title>
    <meta name="description" content="사진 속 아랍어를 한 글자씩 한글 발음으로 읽어 주는 학습 도구" />

    <!-- 주소창·상태바 색을 팔레트에 맞춘다 -->
    <meta name="theme-color" content="#E7EAE3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)" />

    <!-- 홈 화면에 추가했을 때 앱처럼 뜨게 하는 것들.
         아이폰은 manifest 대신 이 메타들과 apple-touch-icon 을 본다
         (iOS 16.4 부터는 manifest 의 display 도 읽지만, 옛 버전 대비로 둘 다 둔다). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="아랍어 읽기" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
