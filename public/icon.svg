<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="아랍어 읽기">
  <!-- 앱 아이콘.
       필사본에서 모음 부호를 붉은 안료로 찍던 관습(루브리케이션) 그대로,
       자음은 먹빛, 부호는 매더 레드로 둔다. 앱이 가르치는 단위
       "자음 하나 + 거기 붙은 부호" 자체가 마크다.

       부호는 글꼴에 기대지 않고 직접 그린다 — 색을 따로 줘야 하고
       글꼴마다 앉는 자리가 달라지기 때문이다.

       이 파일이 원본이다. 같은 폴더의 PNG 들은 여기서 뽑아낸 것이라,
       아이콘을 바꾸려면 이걸 고치고 180·192·512 크기로 다시 내보내면 된다. -->
  <rect width="512" height="512" fill="#EFF1EC"/>
  <g transform="translate(-72.2 -79.8) scale(1.2647)">
    <text x="256" y="300" text-anchor="middle"
          font-family="'Noto Naskh Arabic','Amiri','Scheherazade New',FreeSerif,serif" font-size="300" fill="#171C1A">س</text>
    <line x1="295.3" y1="202.0"
          x2="364.3" y2="172.0"
          stroke="#A8322A" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
